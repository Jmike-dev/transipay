spring.application.name=transipay
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# M-Pesa / Daraja
daraja.consumer-key=${DARAJA_CONSUMER_KEY}
daraja.consumer-secret=${DARAJA_CONSUMER_SECRET}
daraja.saf-url=${DARAJA_SAF_URL}
daraja.saf-short-code=${DARAJA_SAF_SHORTCODE}
daraja.saf-passkey=${DARAJA_SAF_PASSKEY}
daraja.saf-callback-url=${DARAJA_SAF_CALLBACK_URL}